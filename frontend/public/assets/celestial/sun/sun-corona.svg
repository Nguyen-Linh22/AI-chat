<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 560" width="100%" height="100%" fill="none" aria-hidden="true">
  <defs>
    <!-- Diffuse Atmospheric Halo (Breathing): 560px diameter -->
    <radialGradient id="celestial-halo-diffuse" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFF2B2" stop-opacity="0.38"/>
      <stop offset="35%" stop-color="#FFE8A3" stop-opacity="0.22"/>
      <stop offset="65%" stop-color="#C8E8FC" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#C8E8FC" stop-opacity="0"/>
    </radialGradient>

    <!-- Chromosphere & Inner Corona: 180px diameter -->
    <radialGradient id="celestial-chromosphere" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.92"/>
      <stop offset="30%" stop-color="#FFF8DB" stop-opacity="0.80"/>
      <stop offset="60%" stop-color="#FFE394" stop-opacity="0.45"/>
      <stop offset="85%" stop-color="#FFD46E" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#FFC83B" stop-opacity="0"/>
    </radialGradient>

    <!-- Photosphere Solar Core Disc: 64px diameter -->
    <radialGradient id="celestial-photosphere" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="1.0"/>
      <stop offset="70%" stop-color="#FFFFFF" stop-opacity="1.0"/>
      <stop offset="85%" stop-color="#FFFDF0" stop-opacity="0.98"/>
      <stop offset="100%" stop-color="#FFE8A3" stop-opacity="0.92"/>
    </radialGradient>

    <!-- Specular Drop Shadow filter for solar radiance -->
    <filter id="celestial-core-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Layer 3: Diffuse Atmospheric Halo (560px) -->
  <circle cx="280" cy="280" r="280" fill="url(#celestial-halo-diffuse)"/>

  <!-- Layer 2: Inner Chromosphere & Corona (180px) -->
  <circle cx="280" cy="280" r="90" fill="url(#celestial-chromosphere)"/>

  <!-- Layer 1: Photosphere Core Disc (64px) with radiance filter -->
  <circle cx="280" cy="280" r="32" fill="url(#celestial-photosphere)" filter="url(#celestial-core-glow)"/>
</svg>