<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Chat</title>
    <script>
      (function() {
        try {
          var t = localStorage.getItem('theme');
          var valid = t === 'light' || t === 'dark' || t === 'zyricon';
          var theme = valid ? t : 'dark';

          var path = (window.location && window.location.pathname) ? window.location.pathname : '';
          var clean = path.split('?')[0].split('#')[0].replace(/\/+/g, '/');
          var isWorkspace =
            /^\/chat(?:\/[^/]+)?\/?$/.test(clean) ||
            /^\/c\/[^/]+\/?$/.test(clean);

          var effectiveTheme = (theme === 'zyricon' && !isWorkspace) ? 'dark' : theme;
          var root = document.documentElement;
          if (effectiveTheme === 'zyricon') {
            root.classList.add('dark', 'zyricon');
            root.classList.remove('light');
          } else if (effectiveTheme === 'dark') {
            root.classList.add('dark');
            root.classList.remove('light', 'zyricon');
          } else {
            root.classList.remove('dark', 'zyricon');
            root.classList.add('light');
          }
          root.setAttribute('data-theme', effectiveTheme);
        } catch (e) {}
      })();
    </script>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
